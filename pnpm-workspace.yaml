packages:
  - packages/*
  - examples/*
  - bench/*
allowBuilds:
  koffi: true
  esbuild: true
  '@docmd/engine-rust': true
  scriptc: true
minimumReleaseAgeExclude:
  - scriptc
  - '@scriptc/*'
  - "@chttp/router@0.2.1"
  - "@chttp/val@0.2.1"
versioning:
  ignore:
    - "@cutils-example/todo-app"
  fixed:
    - ["@cutils/sqlite", "@chttp/cache", "@chttp/mcp"]
  changelog:
    storage: repository
