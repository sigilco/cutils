packages:
  - packages/*
  - examples/*
  - bench/*
allowBuilds:
  koffi: true
  esbuild: true
  '@docmd/engine-rust': true
  scriptc: true
minimumReleaseAgeExclude:
  - scriptc
  - '@scriptc/*'
  - "@chttp/router@0.2.1"
  - "@chttp/val@0.2.1"
versioning:
  ignore:
    - "@cutils-example/todo-app"
    - "@cutils-example/todo-app-postgres"
  fixed:
    - ["@cutils/sqlite", "@cutils/postgres", "@cutils/mongo", "@chttp/cache", "@chttp/mcp", "@chttp/auth"]
  changelog:
    storage: repository
